<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Deep Obsidian to Midnight Navy Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Electric Royal-to-Cyan Gradient for the Iconic Heptagon Track -->
    <linearGradient id="primaryTrackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Golden Sunrise Accent for the Chick/Piyo Beak -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Crisp Drop Shadow for Foreground Glyphs -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base App Background (Squircle-Friendly Solid Canvas) -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="112" />

  <!-- Subtle Ambient Radial Glow in Center -->
  <circle cx="256" cy="256" r="220" fill="url(#centerGlow)" />

  <!-- Outer Iconic Daily TOEIC 7-Node Heptagon Constellation -->
  <!-- Radians: -90, -38.57, +12.86, +64.29, +115.71, +167.14, +218.57 deg -->
  <!-- R = 158px from center (256, 256) -->
  <!-- Vertices:
       Node 1 (top): (256, 98)
       Node 2: (379, 158)
       Node 3: (410, 291)
       Node 4: (329, 398)
       Node 5: (183, 398)
       Node 6: (102, 291)
       Node 7: (133, 158)
  -->
  <g filter="url(#shadow)">
    <!-- Continuous Precision Heptagon Ring -->
    <polygon 
      points="256,98 379,158 410,291 329,398 183,398 102,291 133,158" 
      fill="none" 
      stroke="url(#primaryTrackGrad)" 
      stroke-width="8" 
      stroke-linejoin="round"
      opacity="0.85"
    />

    <!-- Subtle Connection Rays Leading to Core Growth -->
    <line x1="256" y1="98" x2="256" y2="200" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,6" opacity="0.4" />
    <line x1="329" y1="398" x2="280" y2="300" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4,6" opacity="0.4" />
    <line x1="183" y1="398" x2="232" y2="300" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="4,6" opacity="0.4" />

    <!-- 7 Constellation Nodes (Part 1 - Part 7 Mastery Dots) -->
    <!-- Node 1: Apex (Active Accent Node) -->
    <circle cx="256" cy="98" r="14" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="256" cy="98" r="6" fill="#ffffff" />

    <!-- Node 2 -->
    <circle cx="379" cy="158" r="9" fill="#60a5fa" />
    <circle cx="379" cy="158" r="4" fill="#ffffff" />

    <!-- Node 3 -->
    <circle cx="410" cy="291" r="9" fill="#3b82f6" />
    <circle cx="410" cy="291" r="4" fill="#ffffff" />

    <!-- Node 4 -->
    <circle cx="329" cy="398" r="9" fill="#2563eb" />
    <circle cx="329" cy="398" r="4" fill="#ffffff" />

    <!-- Node 5 -->
    <circle cx="183" cy="398" r="9" fill="#4f46e5" />
    <circle cx="183" cy="398" r="4" fill="#ffffff" />

    <!-- Node 6 -->
    <circle cx="102" cy="291" r="9" fill="#6366f1" />
    <circle cx="102" cy="291" r="4" fill="#ffffff" />

    <!-- Node 7 -->
    <circle cx="133" cy="158" r="9" fill="#0ea5e9" />
    <circle cx="133" cy="158" r="4" fill="#ffffff" />
  </g>

  <!-- Central Iconic Minimal Mascot Glyph: "Toipiyo" Modern Geometric Bird Silhouette -->
  <!-- Designed with pure modern Scandinavian/Japanese minimal curves: Clean, memorable, instant silhouette -->
  <g filter="url(#shadow)">
    <!-- Sleek Main Head & Torso Capsule in Crisp Ultra-White -->
    <path 
      d="M 230 185
         C 275 185, 305 215, 305 258
         C 305 305, 268 335, 222 335
         C 182 335, 154 305, 154 266
         C 154 220, 185 185, 230 185 Z"
      fill="#ffffff"
    />

    <!-- Minimal Cute Eye: Precise, High-Contrast Intelligent Gaze -->
    <circle cx="264" cy="235" r="9.5" fill="#0f172a" />
    <!-- Catchlight sparkle -->
    <circle cx="267" cy="232" r="3.2" fill="#ffffff" />

    <!-- Energetic Forward-Pointing Sharp Beak (Symbolizing focus & forward progress) -->
    <path 
      d="M 298 238 
         L 352 248 
         L 299 266 
         Z" 
      fill="url(#beakGrad)"
      filter="url(#glow)"
    />

    <!-- Subtle Wing Arc Silhouette Line in Sophisticated Soft Slate -->
    <path 
      d="M 188 272 
         C 205 298, 238 306, 260 292" 
      fill="none" 
      stroke="#cbd5e1" 
      stroke-width="5" 
      stroke-linecap="round" 
    />
  </g>

  <!-- Tiny Vibrant Teal Power Sprout / Chick Crest on Apex of Head -->
  <path 
    d="M 232 185 
       C 230 156, 252 142, 266 148 
       C 255 162, 246 174, 238 185 Z" 
    fill="#38bdf8" 
  />
</svg>
